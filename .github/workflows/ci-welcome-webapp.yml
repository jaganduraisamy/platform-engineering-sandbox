# Build and publish welcome-webapp once (CI).
# Same image is promoted across Kustomize envs (dev/uat/prod) later — do not rebuild per env.
# Does NOT deploy to Kind.

name: ci-welcome-webapp

on:
  push:
    branches: [main, "lab/**"]
    paths:
      - "7_kustomize-webapp/app/**"
      - ".github/workflows/ci-welcome-webapp.yml"
  pull_request:
    paths:
      - "7_kustomize-webapp/app/**"
      - ".github/workflows/ci-welcome-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: welcome-webapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.sha_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=welcome-webapp
            org.opencontainers.image.description=Platform demo welcome page (env via Kustomize)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: 7_kustomize-webapp/app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### welcome-webapp published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promote this **same** tag across Kustomize overlays (dev/uat/prod) — do not rebuild per env." >> "$GITHUB_STEP_SUMMARY"
